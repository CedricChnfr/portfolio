<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <style>
      .layer { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .protocol { stroke: #ff6b6b; stroke-width: 1.5; fill: #ffe8e8; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .text { font-family: Arial; font-size: 10px; fill: #333; }
      .label { font-family: Arial; font-size: 11px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
      .example { font-family: 'Courier New', monospace; font-size: 9px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="130" y="25">Modèle OSI - 7 Couches d'Interconnexion</text>
  
  <!-- Couche 7 - Application -->
  <rect class="layer" x="50" y="60" width="150" height="35" rx="3"/>
  <text class="label" x="80" y="80">7. Application</text>
  <rect class="protocol" x="220" y="65" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="80">HTTP, FTP, SMTP, DNS, SSH, Telnet</text>
  
  <!-- Couche 6 - Présentation -->
  <rect class="layer" x="50" y="100" width="150" height="35" rx="3"/>
  <text class="label" x="75" y="120">6. Présentation</text>
  <rect class="protocol" x="220" y="105" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="120">SSL/TLS, JPEG, MPEG, ASCII, Chiffrement</text>
  
  <!-- Couche 5 - Session -->
  <rect class="layer" x="50" y="140" width="150" height="35" rx="3"/>
  <text class="label" x="90" y="160">5. Session</text>
  <rect class="protocol" x="220" y="145" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="160">NetBIOS, RPC, PPTP, Gestion sessions</text>
  
  <!-- Couche 4 - Transport -->
  <rect class="layer" x="50" y="180" width="150" height="35" rx="3"/>
  <text class="label" x="85" y="200">4. Transport</text>
  <rect class="protocol" x="220" y="185" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="200">TCP (fiable), UDP (rapide), Ports</text>
  
  <!-- Couche 3 - Réseau -->
  <rect class="layer" x="50" y="220" width="150" height="35" rx="3"/>
  <text class="label" x="95" y="240">3. Réseau</text>
  <rect class="protocol" x="220" y="225" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="240">IP, ICMP, Routage, Adresses IP</text>
  
  <!-- Couche 2 - Liaison -->
  <rect class="layer" x="50" y="260" width="150" height="35" rx="3"/>
  <text class="label" x="85" y="280">2. Liaison</text>
  <rect class="protocol" x="220" y="265" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="280">Ethernet, WiFi, MAC, Trames, Commutateurs</text>
  
  <!-- Couche 1 - Physique -->
  <rect class="layer" x="50" y="300" width="150" height="35" rx="3"/>
  <text class="label" x="85" y="320">1. Physique</text>
  <rect class="protocol" x="220" y="305" width="250" height="25" rx="3"/>
  <text class="example" x="230" y="320">Câbles, Fibre optique, Signaux électriques</text>
  
  <!-- Flèche de flux -->
  <line class="arrow" x1="30" y1="60" x2="30" y2="330"/>
  <text class="text" x="5" y="200" transform="rotate(-90, 5, 200)" font-weight="bold">Flux de données</text>
  
  <!-- Encapsulation -->
  <rect x="50" y="355" width="420" height="40" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="160" y="375">Encapsulation descendante :</text>
  <text class="text" x="60" y="390">Données → Segments → Paquets → Trames → Bits</text>
</svg>
