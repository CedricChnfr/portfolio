<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .system { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { stroke: #4ecdc4; stroke-width: 2; stroke-dasharray: 5,3; }
      .text { font-family: Arial; font-size: 12px; fill: #333; }
      .label { font-family: Arial; font-size: 13px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
      .math { font-family: 'Courier New', monospace; font-size: 11px; fill: #333; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="130" y="25">Commande Numérique - Système Échantillonné</text>
  
  <!-- Consigne r(k) -->
  <circle cx="60" cy="120" r="15" fill="white" stroke="#333" stroke-width="2"/>
  <text class="text" x="50" y="125">r(k)</text>
  
  <!-- Sommateur -->
  <circle cx="120" cy="120" r="15" fill="white" stroke="#333" stroke-width="2"/>
  <text class="text" x="114" y="125">+</text>
  <text class="text" x="114" y="138" font-size="10px">-</text>
  
  <!-- Correcteur C(z) -->
  <rect class="box" x="170" y="95" width="80" height="50" rx="5"/>
  <text class="label" x="195" y="118">C(z)</text>
  <text class="math" x="180" y="135">PID discret</text>
  
  <!-- Bloqueur d'ordre zéro (BOZ) -->
  <rect class="box" x="290" y="95" width="60" height="50" rx="5"/>
  <text class="label" x="305" y="118">BOZ</text>
  <text class="math" x="295" y="135">e^(-Ts)</text>
  
  <!-- Système G(s) -->
  <rect class="system" x="390" y="95" width="80" height="50" rx="5"/>
  <text class="label" x="415" y="118">G(s)</text>
  <text class="math" x="395" y="135">Système</text>
  
  <!-- Sortie y(k) -->
  <circle cx="520" cy="120" r="15" fill="white" stroke="#333" stroke-width="2"/>
  <text class="text" x="510" y="125">y(k)</text>
  
  <!-- Échantillonneur -->
  <circle cx="520" cy="200" r="8" fill="#4ecdc4"/>
  <line stroke="#4ecdc4" stroke-width="2" x1="520" y1="192" x2="520" y2="180"/>
  <text class="text" x="535" y="205">Te</text>
  
  <!-- Flèches vers l'avant -->
  <line class="arrow" x1="75" y1="120" x2="105" y2="120"/>
  <line class="arrow" x1="135" y1="120" x2="170" y2="120"/>
  <line class="arrow" x1="250" y1="120" x2="290" y2="120"/>
  <line class="arrow" x1="350" y1="120" x2="390" y2="120"/>
  <line class="arrow" x1="470" y1="120" x2="505" y2="120"/>
  
  <!-- Retour -->
  <path class="feedback" d="M 520 135 L 520 200 L 120 200 L 120 135" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Labels -->
  <text class="text" x="85" y="110">e(k)</text>
  <text class="text" x="145" y="110">ε(k)</text>
  <text class="text" x="260" y="110">u(k)</text>
  <text class="text" x="360" y="110">u(t)</text>
  <text class="text" x="480" y="110">y(t)</text>
  
  <!-- Description -->
  <rect x="50" y="240" width="450" height="90" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="180" y="265">Transformation en Z :</text>
  <text class="math" x="70" y="285">• Période d'échantillonnage Te → z = e^(sTe)</text>
  <text class="math" x="70" y="305">• Fonction de transfert discrète : H(z) = Y(z)/R(z)</text>
  <text class="math" x="70" y="325">• PID numérique : C(z) = Kp + Ki·Te/(z-1) + Kd·(z-1)/(Te·z)</text>
</svg>
