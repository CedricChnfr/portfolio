<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <defs>
    <style>
      .place { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .transition { stroke: #ff6b6b; stroke-width: 2; fill: #333; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .token { fill: #4ecdc4; stroke: #333; stroke-width: 1; }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="150" y="25">Réseau de Pétri - Exemple Simple</text>
  
  <!-- Places -->
  <circle class="place" cx="100" cy="100" r="25"/>
  <text class="label" x="90" y="105">P1</text>
  <circle class="token" cx="100" cy="85" r="5"/>
  <circle class="token" cx="110" cy="85" r="5"/>
  
  <circle class="place" cx="250" cy="100" r="25"/>
  <text class="label" x="240" y="105">P2</text>
  
  <circle class="place" cx="400" cy="100" r="25"/>
  <text class="label" x="390" y="105">P3</text>
  <circle class="token" cx="400" cy="85" r="5"/>
  
  <circle class="place" cx="175" cy="200" r="25"/>
  <text class="label" x="165" y="205">P4</text>
  
  <!-- Transitions -->
  <rect class="transition" x="165" y="90" width="20" height="50" rx="2"/>
  <text class="label" x="170" y="125" fill="white">T1</text>
  
  <rect class="transition" x="315" y="90" width="20" height="50" rx="2"/>
  <text class="label" x="320" y="125" fill="white">T2</text>
  
  <rect class="transition" x="240" y="170" width="20" height="50" rx="2"/>
  <text class="label" x="245" y="205" fill="white">T3</text>
  
  <!-- Arcs -->
  <line class="arrow" x1="125" y1="100" x2="165" y2="100"/>
  <line class="arrow" x1="185" y1="100" x2="225" y2="100"/>
  <line class="arrow" x1="275" y1="100" x2="315" y2="100"/>
  <line class="arrow" x1="335" y1="100" x2="375" y2="100"/>
  <line class="arrow" x1="250" y1="125" x2="250" y2="170"/>
  <line class="arrow" x1="240" y1="195" x2="200" y2="195"/>
  
  <!-- Labels des arcs -->
  <text class="text" x="143" y="95" fill="#666">2</text>
  <text class="text" x="210" y="95" fill="#666">1</text>
  
  <!-- Description -->
  <rect x="50" y="250" width="400" height="90" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="180" y="275">Éléments clés :</text>
  <text class="text" x="60" y="295">• Places (cercles) : états ou conditions</text>
  <text class="text" x="60" y="315">• Transitions (rectangles) : événements ou actions</text>
  <text class="text" x="60" y="335">• Jetons (points) : ressources ou marquage</text>
  
  <!-- Note franchissement -->
  <rect x="300" y="50" width="180" height="50" rx="5" fill="#ffe8e8" stroke="#ff6b6b" stroke-width="1"/>
  <text class="text" x="310" y="70" font-weight="bold">Franchissement de T1 :</text>
  <text class="text" x="310" y="90">• Retire 2 jetons de P1</text>
  <text class="text" x="310" y="105">• Ajoute 1 jeton à P2</text>
</svg>
