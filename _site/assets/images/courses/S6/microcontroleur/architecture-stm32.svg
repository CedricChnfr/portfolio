<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .cpu { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .peripheral { stroke: #4ecdc4; stroke-width: 2; fill: #e8f9f7; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .text { font-family: 'Courier New', monospace; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="150" y="25">Architecture STM32 - Microcontrôleur</text>
  
  <!-- CPU Core -->
  <rect class="cpu" x="200" y="50" width="150" height="80" rx="5"/>
  <text class="label" x="235" y="80">ARM Cortex-M4</text>
  <text class="text" x="220" y="100">CPU Core + FPU</text>
  <text class="text" x="230" y="115">168 MHz</text>
  
  <!-- Flash Memory -->
  <rect class="box" x="50" y="180" width="100" height="60" rx="5"/>
  <text class="label" x="70" y="205">Flash</text>
  <text class="text" x="60" y="225">512 KB - 1 MB</text>
  
  <!-- SRAM -->
  <rect class="box" x="200" y="180" width="100" height="60" rx="5"/>
  <text class="label" x="225" y="205">SRAM</text>
  <text class="text" x="215" y="225">128 KB - 192 KB</text>
  
  <!-- Peripherals -->
  <rect class="peripheral" x="380" y="50" width="120" height="50" rx="5"/>
  <text class="label" x="410" y="75">GPIO</text>
  <text class="text" x="395" y="90">Digital I/O</text>
  
  <rect class="peripheral" x="380" y="120" width="120" height="50" rx="5"/>
  <text class="label" x="410" y="145">USART</text>
  <text class="text" x="390" y="160">Serial Comm.</text>
  
  <rect class="peripheral" x="380" y="190" width="120" height="50" rx="5"/>
  <text class="label" x="415" y="215">ADC</text>
  <text class="text" x="395" y="230">12-bit, 16 ch.</text>
  
  <rect class="peripheral" x="380" y="260" width="120" height="50" rx="5"/>
  <text class="label" x="410" y="285">Timers</text>
  <text class="text" x="395" y="300">PWM, Capture</text>
  
  <rect class="peripheral" x="380" y="330" width="120" height="50" rx="5"/>
  <text class="label" x="415" y="355">I2C/SPI</text>
  <text class="text" x="395" y="370">Bus protocols</text>
  
  <!-- Bus système -->
  <line class="arrow" x1="275" y1="130" x2="275" y2="180"/>
  <line class="arrow" x1="125" y1="180" x2="125" y2="150"/>
  <line class="arrow" x1="125" y1="150" x2="200" y2="110"/>
  
  <!-- Connexions vers périphériques -->
  <line class="arrow" x1="350" y1="75" x2="380" y2="75"/>
  <line class="arrow" x1="350" y1="90" x2="370" y2="145"/>
  <line class="arrow" x1="350" y1="100" x2="365" y2="215"/>
  <line class="arrow" x1="350" y1="110" x2="360" y2="285"/>
  <line class="arrow" x1="350" y1="120" x2="355" y2="355"/>
  
  <!-- Labels bus -->
  <text class="text" x="280" y="160" fill="#666">AHB Bus</text>
  <text class="text" x="355" y="95" fill="#666">APB Bus</text>
</svg>
