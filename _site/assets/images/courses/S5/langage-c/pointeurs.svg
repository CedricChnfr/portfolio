<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .arrow { stroke: #ff6b6b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: 'Courier New', monospace; font-size: 14px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff6b6b"/>
    </marker>
  </defs>
  
  <!-- Variable x -->
  <rect class="box" x="50" y="50" width="80" height="60" rx="5"/>
  <text class="text" x="70" y="85">int x = 42</text>
  <text class="label" x="60" y="125">@0x1000</text>
  
  <!-- Pointeur p -->
  <rect class="box" x="250" y="50" width="100" height="60" rx="5"/>
  <text class="text" x="260" y="85">int *p = &x</text>
  <text class="label" x="270" y="125">@0x2000</text>
  
  <!-- Flèche -->
  <path class="arrow" d="M 250 80 Q 200 80 140 80"/>
  
  <!-- Labels explicatifs -->
  <text class="label" x="160" y="70">pointe vers</text>
  <text class="text" x="150" y="150">*p → 42</text>
  <text class="text" x="150" y="170">&x → 0x1000</text>
</svg>
