<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 1.5; }
      .signal { stroke: #2a7ae2; stroke-width: 2.5; fill: none; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .text { font-family: Arial; font-size: 12px; fill: #333; }
      .label { font-family: Arial; font-size: 14px; fill: #2a7ae2; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Grille -->
  <line class="grid" x1="50" y1="125" x2="450" y2="125"/>
  <line class="grid" x1="50" y1="75" x2="450" y2="75"/>
  <line class="grid" x1="50" y1="175" x2="450" y2="175"/>
  
  <!-- Axes -->
  <line class="axis" x1="50" y1="125" x2="470" y2="125"/>
  <line class="axis" x1="50" y1="30" x2="50" y2="220"/>
  
  <!-- Signal sinusoïdal -->
  <path class="signal" d="M 50 125 Q 87.5 75, 125 125 T 200 125 T 275 125 T 350 125 T 425 125"/>
  
  <!-- Marqueurs d'amplitude -->
  <line class="axis" x1="45" y1="75" x2="55" y2="75"/>
  <line class="axis" x1="45" y1="175" x2="55" y2="175"/>
  <text class="text" x="15" y="80">A</text>
  <text class="text" x="10" y="130">0</text>
  <text class="text" x="15" y="180">-A</text>
  
  <!-- Marqueurs de période -->
  <line class="axis" x1="125" y1="120" x2="125" y2="130"/>
  <line class="axis" x1="200" y1="120" x2="200" y2="130"/>
  <text class="text" x="155" y="145">T</text>
  
  <!-- Labels des axes -->
  <text class="text" x="460" y="120">t</text>
  <text class="text" x="35" y="25">x(t)</text>
  
  <!-- Titre -->
  <text class="label" x="150" y="240">Signal Sinusoïdal : x(t) = A·sin(2πft)</text>
</svg>
