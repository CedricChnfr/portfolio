<svg xmlns="http://www.w3.org/2000/svg" width="450" height="350" viewBox="0 0 450 350">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .kernel { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .text { font-family: 'Courier New', monospace; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 13px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="110" y="25">Architecture Unix/Linux</text>
  
  <!-- Matériel -->
  <rect class="box" x="25" y="280" width="400" height="50" rx="5"/>
  <text class="label" x="160" y="310">Hardware (CPU, RAM, Disques)</text>
  
  <!-- Noyau -->
  <rect class="kernel" x="50" y="200" width="350" height="60" rx="5"/>
  <text class="label" x="170" y="225">Kernel (Noyau)</text>
  <text class="text" x="70" y="245">Gestion mémoire, processus, fichiers</text>
  
  <!-- Shell -->
  <rect class="box" x="75" y="120" width="300" height="50" rx="5"/>
  <text class="label" x="180" y="150">Shell (bash, zsh)</text>
  
  <!-- Applications utilisateur -->
  <rect class="box" x="50" y="50" width="90" height="40" rx="5"/>
  <text class="text" x="65" y="75">ls, cd, cat</text>
  
  <rect class="box" x="180" y="50" width="90" height="40" rx="5"/>
  <text class="text" x="195" y="75">gcc, make</text>
  
  <rect class="box" x="310" y="50" width="90" height="40" rx="5"/>
  <text class="text" x="320" y="75">vim, emacs</text>
  
  <!-- Flèches -->
  <path class="arrow" d="M 95 90 L 150 120"/>
  <path class="arrow" d="M 225 90 L 225 120"/>
  <path class="arrow" d="M 355 90 L 300 120"/>
  
  <path class="arrow" d="M 225 170 L 225 200"/>
  <path class="arrow" d="M 225 260 L 225 280"/>
  
  <!-- Labels des couches -->
  <text class="text" x="10" y="75" fill="#666">User Space</text>
  <text class="text" x="10" y="235" fill="#666">Kernel Space</text>
</svg>
