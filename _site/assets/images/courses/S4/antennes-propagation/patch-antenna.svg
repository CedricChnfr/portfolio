<svg xmlns="http://www.w3.org/2000/svg" width="550" height="450" viewBox="0 0 550 450">
  <defs>
    <style>
      .patch { fill: #ffd700; stroke: #2a7ae2; stroke-width: 2; }
      .substrate { fill: #e8f4f8; stroke: #2a7ae2; stroke-width: 2; }
      .ground { fill: #999; stroke: #333; stroke-width: 2; }
      .feed { fill: #ff6b6b; stroke: #ff6b6b; stroke-width: 2; }
      .dimension { stroke: #333; stroke-width: 1; marker-end: url(#arrow); marker-start: url(#arrow); }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
      .math { font-family: 'Courier New', monospace; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="150" y="25">Antenne Patch Rectangulaire</text>
  
  <!-- Vue 3D isométrique -->
  <g transform="translate(100, 60)">
    <!-- Plan de masse -->
    <path class="ground" d="M 20 140 L 220 140 L 240 120 L 40 120 Z"/>
    <text class="text" x="90" y="135">Plan de masse (GND)</text>
    
    <!-- Substrat -->
    <path class="substrate" d="M 40 80 L 240 80 L 240 120 L 40 120 Z"/>
    <path class="substrate" d="M 40 80 L 60 60 L 260 60 L 240 80 Z"/>
    <path class="substrate" d="M 240 80 L 260 60 L 260 100 L 240 120 Z"/>
    <text class="text" x="125" y="105" fill="#2a7ae2">Substrat (εr, h)</text>
    
    <!-- Patch -->
    <path class="patch" d="M 60 40 L 220 40 L 220 60 L 60 60 Z"/>
    <path class="patch" d="M 60 40 L 75 28 L 235 28 L 220 40 Z"/>
    <path class="patch" d="M 220 40 L 235 28 L 235 48 L 220 60 Z"/>
    <text class="label" x="120" y="50">Patch métallique</text>
    
    <!-- Point d'alimentation -->
    <circle class="feed" cx="110" cy="50" r="4"/>
    <line class="feed" x1="110" y1="54" x2="110" y2="80"/>
    <text class="text" x="115" y="68" fill="#ff6b6b">Feed</text>
  </g>
  
  <!-- Vue de dessus avec dimensions -->
  <g transform="translate(320, 80)">
    <rect class="patch" x="50" y="30" width="140" height="80" rx="2"/>
    <text class="label" x="100" y="75">Patch</text>
    
    <!-- Point d'alimentation -->
    <circle class="feed" cx="100" cy="70" r="5"/>
    <text class="text" x="75" y="95" fill="#ff6b6b">x₀, y₀</text>
    
    <!-- Dimensions -->
    <line class="dimension" x1="50" y1="120" x2="190" y2="120"/>
    <text class="math" x="110" y="135">L</text>
    
    <line class="dimension" x1="200" y1="30" x2="200" y2="110"/>
    <text class="math" x="205" y="75">W</text>
    
    <text class="text" x="55" y="20">Vue de dessus</text>
  </g>
  
  <!-- Formules de dimensionnement -->
  <rect x="50" y="220" width="480" height="110" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="200" y="245">Formules de dimensionnement :</text>
  
  <text class="math" x="60" y="265">Largeur : W = (c / 2fr) × √(2 / (εr + 1))</text>
  <text class="math" x="60" y="285">εreff = (εr + 1)/2 + (εr - 1)/2 × (1 + 12h/W)^(-1/2)</text>
  <text class="math" x="60" y="305">ΔL = 0.412h × ((εreff + 0.3)(W/h + 0.264)) / ((εreff - 0.258)(W/h + 0.8))</text>
  <text class="math" x="60" y="325">Longueur : L = (c / 2fr√εreff) - 2ΔL</text>
  
  <!-- Caractéristiques -->
  <rect x="50" y="350" width="230" height="90" rx="5" fill="#ffe8e8" stroke="#ff6b6b" stroke-width="1"/>
  <text class="label" x="100" y="375">Avantages :</text>
  <text class="text" x="60" y="395">• Faible profil, léger</text>
  <text class="text" x="60" y="415">• Fabrication PCB standard</text>
  <text class="text" x="60" y="435">• Intégration facile, faible coût</text>
  
  <rect x="300" y="350" width="230" height="90" rx="5" fill="#e8f4f8" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="345" y="375">Inconvénients :</text>
  <text class="text" x="310" y="395">• Bande passante étroite (2-5%)</text>
  <text class="text" x="310" y="415">• Efficacité moyenne (70-90%)</text>
  <text class="text" x="310" y="435">• Pertes diélectriques</text>
</svg>
