<svg xmlns="http://www.w3.org/2000/svg" width="550" height="400" viewBox="0 0 550 400">
  <defs>
    <style>
      .antenna { stroke: #2a7ae2; stroke-width: 3; fill: none; }
      .feed { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .radiation { stroke: #4ecdc4; stroke-width: 1.5; fill: none; stroke-dasharray: 3,3; }
      .arrow { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
      .math { font-family: 'Courier New', monospace; font-size: 10px; fill: #666; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="170" y="25">Antenne Dipôle λ/2</text>
  
  <!-- Dipôle -->
  <line class="antenna" x1="275" y1="80" x2="275" y2="200"/>
  <line class="antenna" x1="275" y1="220" x2="275" y2="340"/>
  
  <!-- Point d'alimentation -->
  <rect class="feed" x="265" y="205" width="20" height="10" rx="2"/>
  <text class="text" x="240" y="212" fill="#ff6b6b">Feed</text>
  
  <!-- Dimensions -->
  <line class="arrow" x1="290" y1="80" x2="290" y2="200"/>
  <line class="arrow" x1="290" y1="340" x2="290" y2="220"/>
  <text class="math" x="295" y="145">λ/4</text>
  <text class="math" x="295" y="280">λ/4</text>
  
  <!-- Accolades pour longueur totale -->
  <path d="M 310 80 Q 320 80, 320 90 L 320 310 Q 320 320, 310 320" stroke="#333" stroke-width="1.5" fill="none"/>
  <text class="label" x="325" y="210">λ/2</text>
  
  <!-- Diagramme de rayonnement (simplifié) -->
  <ellipse cx="275" cy="210" rx="120" ry="160" class="radiation"/>
  <ellipse cx="275" cy="210" rx="80" ry="100" class="radiation"/>
  <ellipse cx="275" cy="210" rx="40" ry="50" class="radiation"/>
  
  <!-- Caractéristiques -->
  <rect x="40" y="50" width="180" height="160" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="80" y="75">Caractéristiques :</text>
  <text class="text" x="50" y="95">• Impédance : Z = 73 + j42.5 Ω</text>
  <text class="text" x="50" y="115">• Gain : 2.15 dBi</text>
  <text class="text" x="50" y="135">• Longueur : L ≈ 0.95 × λ/2</text>
  <text class="text" x="50" y="155">• Omnidirectionnel (plan H)</text>
  <text class="text" x="50" y="175">• Polarisation linéaire</text>
  <text class="text" x="50" y="195">• Directivité : 1.64 (2.15 dBi)</text>
  
  <!-- Vue de dessus (diagramme H) -->
  <text class="label" x="380" y="75">Plan H (omnidirectionnel)</text>
  <circle cx="465" cy="130" r="50" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <line x1="415" y1="130" x2="515" y2="130" stroke="#333" stroke-width="1"/>
  <line x1="465" y1="80" x2="465" y2="180" stroke="#333" stroke-width="1"/>
  <circle cx="465" cy="130" r="3" fill="#ff6b6b"/>
  
  <!-- Vue de face (diagramme E) -->
  <text class="label" x="380" y="230">Plan E (directif)</text>
  <path d="M 465 260 Q 430 285, 465 310 Q 500 285, 465 260" stroke="#4ecdc4" stroke-width="2" fill="none"/>
  <line x1="415" y1="285" x2="515" y2="285" stroke="#333" stroke-width="1"/>
  <line x1="465" y1="235" x2="465" y2="335" stroke="#333" stroke-width="1"/>
  <circle cx="465" cy="285" r="3" fill="#ff6b6b"/>
  
  <!-- Formules -->
  <rect x="40" y="240" width="300" height="100" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="120" y="265">Dimensionnement :</text>
  <text class="math" x="50" y="285">λ = c / f    où c = 3×10⁸ m/s</text>
  <text class="math" x="50" y="305">L_physique ≈ 0.95 × (λ/2)  (effet capacitif)</text>
  <text class="math" x="50" y="325">Exemple : f = 433 MHz → λ = 69.3 cm → L ≈ 33 cm</text>
  
  <!-- Applications -->
  <text class="label" x="380" y="360">Applications : WiFi, FM, Radio amateur</text>
</svg>
