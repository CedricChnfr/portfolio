<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .class { stroke: #ff6b6b; stroke-width: 2; fill: white; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .inherit { stroke: #2a7ae2; stroke-width: 2; marker-end: url(#triangle); }
      .text { font-family: 'Courier New', monospace; font-size: 10px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="triangle" markerWidth="15" markerHeight="15" refX="0" refY="5" orient="auto">
      <polygon points="0 5, 10 0, 10 10" fill="white" stroke="#2a7ae2" stroke-width="2"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="130" y="25">POO C++ - Héritage et Polymorphisme</text>
  
  <!-- Classe de base : Animal -->
  <rect class="class" x="180" y="50" width="140" height="100" rx="5"/>
  <text class="label" x="220" y="70" fill="#2a7ae2">Animal</text>
  <line x1="180" y1="75" x2="320" y2="75" stroke="#666" stroke-width="1"/>
  <text class="text" x="190" y="92">- nom: string</text>
  <text class="text" x="190" y="107">- age: int</text>
  <line x1="180" y1="115" x2="320" y2="115" stroke="#666" stroke-width="1"/>
  <text class="text" x="190" y="132">+ crier(): void</text>
  <text class="text" x="190" y="147">+ manger(): void</text>
  
  <!-- Classe dérivée : Chien -->
  <rect class="class" x="50" y="220" width="140" height="90" rx="5"/>
  <text class="label" x="95" y="240" fill="#ff6b6b">Chien</text>
  <line x1="50" y1="245" x2="190" y2="245" stroke="#666" stroke-width="1"/>
  <text class="text" x="60" y="262">- race: string</text>
  <line x1="50" y1="270" x2="190" y2="270" stroke="#666" stroke-width="1"/>
  <text class="text" x="60" y="287">+ crier(): void</text>
  <text class="text" x="60" y="302">+ aboyer(): void</text>
  
  <!-- Classe dérivée : Chat -->
  <rect class="class" x="310" y="220" width="140" height="90" rx="5"/>
  <text class="label" x="360" y="240" fill="#ff6b6b">Chat</text>
  <line x1="310" y1="245" x2="450" y2="245" stroke="#666" stroke-width="1"/>
  <text class="text" x="320" y="262">- couleur: string</text>
  <line x1="310" y1="270" x2="450" y2="270" stroke="#666" stroke-width="1"/>
  <text class="text" x="320" y="287">+ crier(): void</text>
  <text class="text" x="320" y="302">+ miauler(): void</text>
  
  <!-- Flèches d'héritage -->
  <path class="inherit" d="M 120 220 L 120 180 L 250 180 L 250 150" fill="none"/>
  <path class="inherit" d="M 380 220 L 380 180 L 250 180 L 250 150" fill="none"/>
  
  <!-- Exemple de code -->
  <rect x="50" y="330" width="400" height="60" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="text" x="60" y="350">Animal* ptr = new Chien("Rex");</text>
  <text class="text" x="60" y="365">ptr->crier();  // Polymorphisme : appelle Chien::crier()</text>
  <text class="text" x="60" y="380">delete ptr;</text>
</svg>
