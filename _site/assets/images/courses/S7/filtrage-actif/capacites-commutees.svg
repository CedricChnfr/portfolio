<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <defs>
    <style>
      .component { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .opamp { stroke: #ff6b6b; stroke-width: 2.5; fill: white; }
      .line { stroke: #333; stroke-width: 2; }
      .cap { stroke: #4ecdc4; stroke-width: 2; fill: white; }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="100" y="25">Filtre Actif à Capacités Commutées</text>
  
  <!-- Capacité C1 -->
  <line class="line" x1="80" y1="150" x2="120" y2="150"/>
  <line class="cap" x1="120" y1="135" x2="120" y2="165"/>
  <line class="cap" x1="125" y1="135" x2="125" y2="165"/>
  <text class="text" x="110" y="130">C₁</text>
  
  <!-- Switch φ1 -->
  <circle cx="150" cy="150" r="3" fill="#333"/>
  <line class="line" x1="125" y1="150" x2="148" y2="142"/>
  <text class="text" x="155" y="145">φ₁</text>
  
  <!-- Capacité C2 -->
  <line class="line" x1="175" y1="150" x2="200" y2="150"/>
  <line class="cap" x1="200" y1="135" x2="200" y2="165"/>
  <line class="cap" x1="205" y1="135" x2="205" y2="165"/>
  <text class="text" x="190" y="130">C₂</text>
  
  <!-- Switch φ2 -->
  <circle cx="230" cy="150" r="3" fill="#333"/>
  <line class="line" x1="205" y1="150" x2="228" y2="142"/>
  <text class="text" x="235" y="145">φ₂</text>
  
  <!-- AOP -->
  <path class="opamp" d="M 270 120 L 270 180 L 330 150 Z"/>
  <text class="text" x="290" y="155" font-size="14px">-</text>
  
  <!-- Entrée et sortie -->
  <text class="text" x="50" y="155">Vin</text>
  <text class="text" x="360" y="155">Vout</text>
  <line class="line" x1="330" y1="150" x2="370" y2="150"/>
  
  <!-- Masse -->
  <line class="line" x1="270" y1="170" x2="250" y2="170"/>
  <line class="line" x1="250" y1="170" x2="250" y2="200"/>
  <line class="line" x1="240" y1="200" x2="260" y2="200"/>
  <line class="line" x1="243" y1="205" x2="257" y2="205"/>
  <line class="line" x1="246" y1="210" x2="254" y2="210"/>
  
  <!-- Chronogrammes des phases -->
  <text class="label" x="80" y="240">Signaux d'horloge :</text>
  
  <!-- Phase φ1 -->
  <text class="text" x="80" y="260">φ₁:</text>
  <line class="line" x1="110" y1="255" x2="110" y2="245"/>
  <line class="line" x1="110" y1="245" x2="140" y2="245"/>
  <line class="line" x1="140" y1="245" x2="140" y2="255"/>
  <line class="line" x1="140" y1="255" x2="170" y2="255"/>
  <line class="line" x1="170" y1="255" x2="170" y2="245"/>
  <line class="line" x1="170" y1="245" x2="200" y2="245"/>
  
  <!-- Phase φ2 -->
  <text class="text" x="80" y="285">φ₂:</text>
  <line class="line" x1="110" y1="280" x2="140" y2="280"/>
  <line class="line" x1="140" y1="280" x2="140" y2="270"/>
  <line class="line" x1="140" y1="270" x2="170" y2="270"/>
  <line class="line" x1="170" y1="270" x2="170" y2="280"/>
  <line class="line" x1="170" y1="280" x2="200" y2="280"/>
  
  <!-- Description -->
  <rect x="220" y="230" width="260" height="90" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="240" y="250">Principe :</text>
  <text class="text" x="230" y="270">• φ₁ : charge de C₁</text>
  <text class="text" x="230" y="290">• φ₂ : transfert vers C₂</text>
  <text class="text" x="230" y="310">• Résistance équivalente : Req = 1/(C·f)</text>
</svg>
