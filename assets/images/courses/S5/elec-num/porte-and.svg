<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <style>
      .line { stroke: #333; stroke-width: 2; fill: none; }
      .gate { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .text { font-family: Arial; font-size: 14px; fill: #333; }
    </style>
  </defs>
  
  <!-- Porte AND -->
  <path class="gate" d="M 40 30 L 40 90 L 100 90 Q 140 90 140 60 Q 140 30 100 30 Z"/>
  
  <!-- Entrées -->
  <line class="line" x1="10" y1="45" x2="40" y2="45"/>
  <line class="line" x1="10" y1="75" x2="40" y2="75"/>
  <text class="text" x="5" y="50">A</text>
  <text class="text" x="5" y="80">B</text>
  
  <!-- Sortie -->
  <line class="line" x1="140" y1="60" x2="190" y2="60"/>
  <text class="text" x="165" y="55">S</text>
  
  <!-- Label -->
  <text class="text" x="60" y="65" font-weight="bold">AND</text>
</svg>
