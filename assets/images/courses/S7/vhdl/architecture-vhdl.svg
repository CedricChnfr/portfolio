<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" viewBox="0 0 550 350">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .component { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .line { stroke: #333; stroke-width: 2; }
      .text { font-family: 'Courier New', monospace; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="160" y="25">Architecture VHDL - Processeur Simple</text>
  
  <!-- ALU -->
  <rect class="component" x="220" y="80" width="110" height="70" rx="5"/>
  <text class="label" x="250" y="110">ALU</text>
  <text class="text" x="230" y="130">ADD, SUB</text>
  <text class="text" x="230" y="145">AND, OR, XOR</text>
  
  <!-- Registres -->
  <rect class="box" x="80" y="80" width="100" height="70" rx="5"/>
  <text class="label" x="95" y="110">Registres</text>
  <text class="text" x="90" y="130">R0 - R7</text>
  
  <rect class="box" x="370" y="80" width="100" height="70" rx="5"/>
  <text class="label" x="385" y="110">Registres</text>
  <text class="text" x="380" y="130">R0 - R7</text>
  
  <!-- Mémoire -->
  <rect class="box" x="220" y="200" width="110" height="60" rx="5"/>
  <text class="label" x="240" y="225">Mémoire</text>
  <text class="text" x="230" y="245">RAM/ROM</text>
  
  <!-- Unité de contrôle -->
  <rect class="component" x="220" y="300" width="110" height="40" rx="5"/>
  <text class="label" x="230" y="325">Contrôle</text>
  
  <!-- Bus de données -->
  <line class="line" x1="180" y1="115" x2="220" y2="115"/>
  <line class="line" x1="330" y1="115" x2="370" y2="115"/>
  <line class="line" x1="275" y1="150" x2="275" y2="200"/>
  
  <!-- Signaux de contrôle -->
  <line class="line" x1="275" y1="260" x2="275" y2="300" stroke-dasharray="3,3"/>
  
  <!-- Labels signaux -->
  <text class="text" x="190" y="110" fill="#666">Op1</text>
  <text class="text" x="340" y="110" fill="#666">Op2</text>
  <text class="text" x="280" y="180" fill="#666">Résultat</text>
  
  <!-- Signaux externes -->
  <text class="text" x="20" y="120" font-weight="bold">CLK →</text>
  <line class="line" x1="60" y1="115" x2="80" y2="115"/>
  
  <text class="text" x="490" y="120" font-weight="bold">→ OUT</text>
  <line class="line" x1="470" y1="115" x2="490" y2="115"/>
  
  <!-- Description -->
  <rect x="50" y="40" width="450" height="30" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="text" x="70" y="60">entity Processor is port(clk, rst: in std_logic; data_out: out std_logic_vector);</text>
</svg>
