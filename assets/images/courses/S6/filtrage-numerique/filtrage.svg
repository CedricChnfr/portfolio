<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <defs>
    <style>
      .axis { stroke: #333; stroke-width: 1.5; }
      .signal { stroke: #2a7ae2; stroke-width: 2.5; fill: none; }
      .filtered { stroke: #ff6b6b; stroke-width: 2.5; fill: none; }
      .grid { stroke: #ddd; stroke-width: 0.5; }
      .text { font-family: Arial; font-size: 12px; fill: #333; }
      .label { font-family: Arial; font-size: 14px; fill: #2a7ae2; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Grille -->
  <line class="grid" x1="50" y1="80" x2="450" y2="80"/>
  <line class="grid" x1="50" y1="120" x2="450" y2="120"/>
  <line class="grid" x1="50" y1="160" x2="450" y2="160"/>
  <line class="grid" x1="50" y1="200" x2="450" y2="200"/>
  
  <!-- Axes -->
  <line class="axis" x1="50" y1="140" x2="470" y2="140"/>
  <line class="axis" x1="50" y1="30" x2="50" y2="250"/>
  
  <!-- Signal original avec bruit -->
  <path class="signal" d="M 50 140 Q 80 100, 110 140 T 170 140 Q 190 180, 210 140 Q 230 100, 250 140 T 310 140 Q 330 120, 350 140 Q 370 160, 390 140 Q 410 120, 430 140"/>
  
  <!-- Signal filtré (lissé) -->
  <path class="filtered" d="M 50 140 Q 90 110, 130 140 T 210 140 Q 270 140, 330 140 Q 390 140, 430 140" stroke-dasharray="5,3"/>
  
  <!-- Légende -->
  <line class="signal" x1="60" y1="270" x2="100" y2="270"/>
  <text class="text" x="110" y="275">Signal bruité</text>
  
  <line class="filtered" x1="220" y1="270" x2="260" y2="270" stroke-dasharray="5,3"/>
  <text class="text" x="270" y="275">Signal filtré</text>
  
  <!-- Labels des axes -->
  <text class="text" x="460" y="135">f</text>
  <text class="text" x="35" y="25">|H(f)|</text>
  
  <!-- Titre -->
  <text class="label" x="130" y="20">Filtrage Numérique - Réduction du Bruit</text>
</svg>
