<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <defs>
    <style>
      .box { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .opamp { stroke: #ff6b6b; stroke-width: 2.5; fill: white; }
      .line { stroke: #333; stroke-width: 2; }
      .text { font-family: Arial; font-size: 12px; fill: #333; }
      .label { font-family: Arial; font-size: 14px; fill: #2a7ae2; font-weight: bold; }
      .math { font-family: 'Courier New', monospace; font-size: 13px; fill: #333; }
    </style>
  </defs>
  
  <!-- Titre -->
  <text class="label" x="100" y="25">Amplificateur Opérationnel - Montage Inverseur</text>
  
  <!-- AOP (triangle) -->
  <path class="opamp" d="M 200 120 L 200 220 L 300 170 Z"/>
  <text class="text" x="230" y="175" font-size="16px">-</text>
  <text class="text" x="210" y="145">+</text>
  <text class="text" x="210" y="205">-</text>
  
  <!-- Résistance d'entrée R1 -->
  <line class="line" x1="80" y1="140" x2="120" y2="140"/>
  <rect class="box" x="120" y="130" width="60" height="20" rx="3"/>
  <text class="text" x="135" y="145">R1</text>
  <line class="line" x1="180" y1="140" x2="200" y2="140"/>
  
  <!-- Résistance de contre-réaction R2 -->
  <line class="line" x1="200" y1="140" x2="200" y2="80"/>
  <rect class="box" x="200" y="50" width="60" height="20" rx="3"/>
  <text class="text" x="215" y="65">R2</text>
  <line class="line" x1="260" y1="60" x2="340" y2="60"/>
  <line class="line" x1="340" y1="60" x2="340" y2="170"/>
  
  <!-- Entrée non-inverseuse à la masse -->
  <line class="line" x1="200" y1="200" x2="180" y2="200"/>
  <line class="line" x1="180" y1="200" x2="180" y2="240"/>
  <line class="line" x1="170" y1="240" x2="190" y2="240"/>
  <line class="line" x1="173" y1="245" x2="187" y2="245"/>
  <line class="line" x1="176" y1="250" x2="184" y2="250"/>
  
  <!-- Sortie -->
  <line class="line" x1="300" y1="170" x2="340" y2="170"/>
  <line class="line" x1="340" y1="170" x2="380" y2="170"/>
  
  <!-- Alimentation -->
  <line class="line" x1="250" y1="120" x2="250" y2="100"/>
  <text class="text" x="255" y="100">+Vcc</text>
  <line class="line" x1="250" y1="220" x2="250" y2="240"/>
  <text class="text" x="255" y="245">-Vcc</text>
  
  <!-- Labels signaux -->
  <text class="text" x="50" y="135">Ve</text>
  <text class="text" x="390" y="175">Vs</text>
  
  <!-- Formule -->
  <rect class="box" x="80" y="270" width="340" height="60" rx="5" fill="#ffe8e8"/>
  <text class="label" x="180" y="295">Gain en tension:</text>
  <text class="math" x="150" y="315">G = Vs/Ve = -R2/R1</text>
</svg>
