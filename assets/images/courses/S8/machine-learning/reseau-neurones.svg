<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <style>
      .neuron { stroke: #2a7ae2; stroke-width: 2; fill: #e8f4f8; }
      .input { stroke: #4ecdc4; stroke-width: 2; fill: #e8f9f7; }
      .output { stroke: #ff6b6b; stroke-width: 2; fill: #ffe8e8; }
      .arrow { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .weight { font-family: 'Courier New', monospace; font-size: 9px; fill: #666; }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="120" y="25">Réseau de Neurones - Perceptron Multicouche</text>
  
  <!-- Couche d'entrée -->
  <text class="label" x="50" y="60">Entrées</text>
  <circle class="input" cx="80" cy="100" r="15"/>
  <text class="text" x="72" y="105">x₁</text>
  
  <circle class="input" cx="80" cy="150" r="15"/>
  <text class="text" x="72" y="155">x₂</text>
  
  <circle class="input" cx="80" cy="200" r="15"/>
  <text class="text" x="72" y="205">x₃</text>
  
  <!-- Couche cachée -->
  <text class="label" x="210" y="60">Couche cachée</text>
  <circle class="neuron" cx="240" cy="80" r="18"/>
  <text class="text" x="232" y="85">h₁</text>
  
  <circle class="neuron" cx="240" cy="140" r="18"/>
  <text class="text" x="232" y="145">h₂</text>
  
  <circle class="neuron" cx="240" cy="200" r="18"/>
  <text class="text" x="232" y="205">h₃</text>
  
  <circle class="neuron" cx="240" cy="260" r="18"/>
  <text class="text" x="232" y="265">h₄</text>
  
  <!-- Couche de sortie -->
  <text class="label" x="380" y="60">Sorties</text>
  <circle class="output" cx="400" cy="120" r="18"/>
  <text class="text" x="392" y="125">y₁</text>
  
  <circle class="output" cx="400" cy="200" r="18"/>
  <text class="text" x="392" y="205">y₂</text>
  
  <!-- Connexions entrée → cachée -->
  <line class="arrow" x1="95" y1="100" x2="222" y2="85"/>
  <line class="arrow" x1="95" y1="100" x2="222" y2="140"/>
  <line class="arrow" x1="95" y1="150" x2="222" y2="140"/>
  <line class="arrow" x1="95" y1="150" x2="222" y2="200"/>
  <line class="arrow" x1="95" y1="200" x2="222" y2="200"/>
  <line class="arrow" x1="95" y1="200" x2="222" y2="260"/>
  
  <!-- Poids (sélection) -->
  <text class="weight" x="135" y="95">w₁₁</text>
  <text class="weight" x="135" y="155">w₂₂</text>
  
  <!-- Connexions cachée → sortie -->
  <line class="arrow" x1="258" y1="85" x2="382" y2="120"/>
  <line class="arrow" x1="258" y1="140" x2="382" y2="120"/>
  <line class="arrow" x1="258" y1="200" x2="382" y2="120"/>
  <line class="arrow" x1="258" y1="260" x2="382" y2="200"/>
  <line class="arrow" x1="258" y1="200" x2="382" y2="200"/>
  
  <!-- Description -->
  <rect x="50" y="300" width="400" height="90" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="160" y="325">Propagation avant :</text>
  <text class="text" x="60" y="345">1. Entrée : vecteur x = [x₁, x₂, x₃]</text>
  <text class="text" x="60" y="365">2. Cachée : hᵢ = σ(Σ wᵢⱼ·xⱼ + bᵢ)  où σ = ReLU, sigmoid...</text>
  <text class="text" x="60" y="385">3. Sortie : yₖ = σ(Σ wₖᵢ·hᵢ + bₖ)</text>
</svg>
