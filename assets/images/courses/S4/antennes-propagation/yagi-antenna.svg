<svg xmlns="http://www.w3.org/2000/svg" width="550" height="350" viewBox="0 0 550 350">
  <defs>
    <style>
      .boom { stroke: #666; stroke-width: 4; fill: none; }
      .reflector { stroke: #ff6b6b; stroke-width: 3; fill: none; }
      .driven { stroke: #2a7ae2; stroke-width: 3; fill: none; }
      .director { stroke: #4ecdc4; stroke-width: 3; fill: none; }
      .radiation { fill: #ffd700; opacity: 0.3; }
      .arrow { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
      .text { font-family: Arial; font-size: 11px; fill: #333; }
      .label { font-family: Arial; font-size: 12px; fill: #2a7ae2; font-weight: bold; }
      .title { font-family: Arial; font-size: 16px; fill: #2a7ae2; font-weight: bold; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Titre -->
  <text class="title" x="180" y="25">Antenne Yagi-Uda</text>
  
  <!-- Boom (perche) -->
  <line class="boom" x1="80" y1="180" x2="480" y2="180"/>
  
  <!-- Réflecteur -->
  <line class="reflector" x1="100" y1="120" x2="100" y2="240"/>
  <text class="text" x="85" y="110" fill="#ff6b6b">Réflecteur</text>
  <text class="text" x="85" y="260" fill="#ff6b6b">(le plus long)</text>
  
  <!-- Élément rayonnant (dipôle alimenté) -->
  <line class="driven" x1="180" y1="130" x2="180" y2="230"/>
  <circle cx="180" cy="180" r="5" fill="#2a7ae2"/>
  <text class="text" x="155" y="110" fill="#2a7ae2">Élément</text>
  <text class="text" x="155" y="125" fill="#2a7ae2">rayonnant</text>
  <text class="text" x="160" y="260" fill="#2a7ae2">(alimenté)</text>
  
  <!-- Directeurs -->
  <line class="director" x1="260" y1="135" x2="260" y2="225"/>
  <text class="text" x="240" y="120" fill="#4ecdc4">Dir 1</text>
  
  <line class="director" x1="330" y1="140" x2="330" y2="220"/>
  <text class="text" x="310" y="125" fill="#4ecdc4">Dir 2</text>
  
  <line class="director" x1="400" y1="143" x2="400" y2="217"/>
  <text class="text" x="380" y="130" fill="#4ecdc4">Dir 3</text>
  
  <line class="director" x1="460" y1="145" x2="460" y2="215"/>
  <text class="text" x="440" y="135" fill="#4ecdc4">Dir 4</text>
  
  <!-- Direction de rayonnement -->
  <path class="radiation" d="M 180 150 L 500 110 L 500 250 L 180 210 Z"/>
  <text class="label" x="320" y="185" fill="#ff8800">Direction principale</text>
  <line class="arrow" x1="490" y1="180" x2="520" y2="180" stroke="#ff8800" stroke-width="3"/>
  
  <!-- Espacement -->
  <line stroke="#333" stroke-width="1" stroke-dasharray="2,2" x1="180" y1="270" x2="260" y2="270"/>
  <text class="text" x="205" y="285">0.2λ - 0.35λ</text>
  
  <!-- Caractéristiques -->
  <rect x="40" y="45" width="240" height="60" rx="5" fill="#f9f9f9" stroke="#2a7ae2" stroke-width="1"/>
  <text class="label" x="100" y="65">Principe :</text>
  <text class="text" x="50" y="85">• Réflecteur : λ/2 + 5% (dirige vers avant)</text>
  <text class="text" x="50" y="100">• Directeurs : λ/2 - 5% (focalisent le faisceau)</text>
  
  <!-- Performances -->
  <rect x="300" y="45" width="220" height="60" rx="5" fill="#ffe8e8" stroke="#ff6b6b" stroke-width="1"/>
  <text class="label" x="355" y="65">Performances :</text>
  <text class="text" x="310" y="85">• Gain : 6-17 dBi (selon nb éléments)</text>
  <text class="text" x="310" y="100">• Très directive (TV, radioamateur)</text>
  
  <!-- Applications -->
  <text class="label" x="200" y="320">Applications : TNT, WiFi directif, liaison point-à-point</text>
</svg>
