<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-emails">
        <ul class="contact-list">
          <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          {%- if site.email2 -%}
          <li><a class="u-email" href="mailto:{{ site.email2 }}">{{ site.email2 }}</a></li>
          {%- endif -%}
        </ul>
      </div>
      <div class="footer-col">
        <div class="social-links">
          <ul class="social-media-list">
            {%- if site.github_username -%}
            <li>
              <a href="https://github.com/{{ site.github_username }}">
                <svg class="svg-icon"><use xlink:href="{{ 'assets/minima-social-icons.svg#github' | relative_url }}"></use></svg>
                <span class="username">{{ site.github_username }}</span>
              </a>
            </li>
            {%- endif -%}
            {%- if site.linkedin_username -%}
            <li>
              <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">
                <svg class="svg-icon"><use xlink:href="{{ 'assets/minima-social-icons.svg#linkedin' | relative_url }}"></use></svg>
                <span class="username">{{ site.linkedin_username }}</span>
              </a>
            </li>
            {%- endif -%}
          </ul>
        </div>
      </div>
    </div>
  </div>
</footer>

<!-- Notification de visite ntfy.sh -->
<script>
  (function() {
    var page = document.title || window.location.pathname;
    var referrer = document.referrer ? document.referrer : 'accès direct';
    var lang = navigator.language || 'inconnu';
    var device = /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
    var screen_res = screen.width + 'x' + screen.height;
    var timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'inconnu';
    var connection = (navigator.connection && navigator.connection.effectiveType) ? navigator.connection.effectiveType : 'inconnu';

    fetch('https://ipapi.co/json/')
      .then(function(r) { return r.json(); })
      .then(function(geo) {
        var body = '📄 ' + page
          + '\n↩ ' + referrer
          + '\n📍 ' + (geo.city || '?') + ', ' + (geo.country_name || '?')
          + '\n🏢 ' + (geo.org || '?')
          + '\n🌐 ' + (geo.ip || '?')
          + '\n🕐 ' + timezone
          + '\n💻 ' + device + ' · ' + screen_res + ' · ' + lang + ' · ' + connection;
        fetch('https://ntfy.sh/cedric-chanfreau-portfolio-2026', {
          method: 'POST',
          body: body,
          headers: {
            'Title': 'Visite portfolio',
            'Priority': 'low',
            'Tags': 'eyes'
          }
        });
      });
  })();
</script>
