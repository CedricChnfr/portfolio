<script>
(function() {
  var translations = window.TRANSLATIONS || {};

  var currentLang = localStorage.getItem('portfolio-lang') || 'fr';

  function applyTranslations() {
    // Translate textContent
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (translations[key] && translations[key][currentLang]) {
        el.textContent = translations[key][currentLang];
      }
    });

    // Translate innerHTML
    document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-html');
      if (translations[key] && translations[key][currentLang]) {
        el.innerHTML = translations[key][currentLang];
      }
    });

    // Translate placeholders
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-placeholder');
      if (translations[key] && translations[key][currentLang]) {
        el.placeholder = translations[key][currentLang];
      }
    });

    // Update toggle button active state
    var frSpan = document.getElementById('lang-fr');
    var enSpan = document.getElementById('lang-en');
    if (frSpan && enSpan) {
      if (currentLang === 'fr') {
        frSpan.classList.add('lang-active');
        enSpan.classList.remove('lang-active');
      } else {
        frSpan.classList.remove('lang-active');
        enSpan.classList.add('lang-active');
      }
    }
  }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('portfolio-lang', lang);
    document.documentElement.lang = lang;
    applyTranslations();
    applyPageTitle();
    document.dispatchEvent(new CustomEvent('langChanged', { detail: { lang: lang } }));
  }

  function getCurrentLang() {
    return currentLang;
  }

  function t(key) {
    if (translations[key] && translations[key][currentLang]) {
      return translations[key][currentLang];
    }
    return key;
  }

  // Expose globally
  window.i18n = {
    setLang: setLang,
    getCurrentLang: getCurrentLang,
    t: t,
    applyTranslations: applyTranslations
  };

  // Translate page title based on URL path
  function applyPageTitle() {
    var pageTitles = translations['page-titles'];
    if (!pageTitles) return;
    var path = window.location.pathname;
    if (pageTitles[path] && pageTitles[path][currentLang]) {
      var h1 = document.querySelector('.post-title, h1');
      if (h1) h1.textContent = pageTitles[path][currentLang];
      var parts = document.title.split('|');
      var siteName = parts.length > 1 ? parts.pop().trim() : document.title;
      document.title = pageTitles[path][currentLang] + ' | ' + siteName;
    }
  }

  // Init on DOM ready
  function init() {
    document.documentElement.lang = currentLang;
    applyTranslations();
    applyPageTitle();

    var toggleBtn = document.getElementById('lang-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        setLang(currentLang === 'fr' ? 'en' : 'fr');
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
