<script>
(function() {
    // Configuration - Appel direct à Ollama
    // Utilise l'URL du domaine pour fonctionner depuis mobile/desktop
    const OLLAMA_URL = 'https://cedric.littlenuage.com:11434/api/generate';
    const MODEL = 'llama3.2:3b'; // Modèle plus précis et factuel
    
    // Prompt système simplifié et optimisé
    const SYSTEM_PROMPT = `Tu es l'assistant IA du portfolio de Cédric CHANFREAU. Tu réponds UNIQUEMENT aux questions sur son profil professionnel.

# INFORMATIONS ESSENTIELLES (À UTILISER EXACTEMENT)

**Formation**

**Expérience**

  → Secure Logger pour ECUs automobiles, revue de code critique
- Alternance Ingénieur Logiciel Embarqué - Vitesco Technologies (Toulouse, Sept 2022 - Sept 2024)
  → Solutions reprogrammation ECU, automatisation tests Python/Jenkins, MISRA/CERT
- Stage international - Vitesco Technologies (Iasi, Roumanie, Juil - Sept 2024)
  → Gestion mémoire Flash sur nouveau microcontrôleur
- Stage - Siemens (Toulouse, Avr - Juil 2022)
  → Analyse rack frein VAL208NG, banc de tests cartes électroniques
- 25+ projets académiques et personnels

**Projets clés**

- Trottinette électrique connectée (IoT)
- Application mobile Toulouse Sport (Flutter)
- Système de détection objets par caméra
- Portfolio web avec chatbot IA

**Objectif**
Recherche CDI Ingénieur Systèmes Embarqués / Cybersécurité (dès sept 2025)
Secteurs : Automobile, Aéronautique, Robotique, IoT

**Liens importants**
- CV complet : https://cedric.littlenuage.com/file/CV_Cedric_Chanfreau_USA.pdf
- Tous les projets : https://cedric.littlenuage.com/jekyll/update/2024/10/03/my-projects.html
- GitHub : github.com/CedricChnfr
- LinkedIn : linkedin.com/in/cedricchanfreau

# RÈGLES DE RÉPONSE

1. SCOPE : Tu réponds SEULEMENT aux questions sur Cédric. Si hors sujet → refuse poliment
2. PRÉCISION : Utilise EXACTEMENT les infos ci-dessus (âge 22 ans, formations, compétences)
3. CONCISION : Réponses courtes (2-4 phrases max), directes, factuelles
4. LIENS : Propose toujours le portfolio pour + de détails : https://cedric.littlenuage.com/
5. TON : Professionnel et accessible, pas d'exagération

Question du recruteur :`;
    
    // État
    let conversationHistory = [];
    
    // Éléments DOM
    const toggleBtn = document.getElementById('chatbot-toggle');
    const chatWindow = document.getElementById('chatbot-window');
    const closeBtn = document.getElementById('chatbot-close');
    const messagesContainer = document.getElementById('chatbot-messages');
    const input = document.getElementById('chatbot-input');
    const sendBtn = document.getElementById('chatbot-send');
    
    // Initialisation
    function init() {
        // Message de bienvenue
        addMessage(
            "Bonjour ! 👋 Je suis l'assistant IA de Cédric. Je peux répondre à vos questions sur son parcours, ses compétences, ses projets et son expérience. N'hésitez pas à me poser des questions !",
            'ai'
        );
        
        // Event listeners
        toggleBtn.addEventListener('click', openChat);
        closeBtn.addEventListener('click', closeChat);
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    }
    
    // Ouvrir le chat
    function openChat() {
        chatWindow.classList.remove('hidden');
        input.focus();
    }
    
    // Fermer le chat
    function closeChat() {
        chatWindow.classList.add('hidden');
    }
    
    // Ajouter un message
    function addMessage(text, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chatbot-message ${type}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'chatbot-message-avatar';
        avatar.textContent = type === 'user' ? '👤' : '🤖';
        
        const content = document.createElement('div');
        content.className = 'chatbot-message-content';
        
        // Formater le texte avec Markdown basique
        if (type === 'ai') {
            content.innerHTML = formatMarkdown(text);
        } else {
            content.textContent = text;
        }
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);
        messagesContainer.appendChild(messageDiv);
        
        // Scroll vers le bas
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    // Formater le texte avec Markdown
    function formatMarkdown(text) {
        // Échapper le HTML
        let html = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        
        // Titres
        html = html.replace(/^### (.+)$/gm, '<h3 class="chat-h3">$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2 class="chat-h2">$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1 class="chat-h1">$1</h1>');
        
        // Gras
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        
        // Italique
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        
        // Liens
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        
        // URLs simples
        html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        
        // Listes à puces
        html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
        
        // Listes numérotées
        html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
        
        // Code inline
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        // Sauts de ligne
        html = html.replace(/\n\n/g, '<br><br>');
        html = html.replace(/\n/g, '<br>');
        
        return html;
    }
    
    // Afficher le chargement
    function showLoading() {
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'chatbot-message ai';
        loadingDiv.id = 'chatbot-loading';
        
        const avatar = document.createElement('div');
        avatar.className = 'chatbot-message-avatar';
        avatar.textContent = '🤖';
        
        const loading = document.createElement('div');
        loading.className = 'chatbot-loading';
        loading.innerHTML = `
            <div class="chatbot-loading-dot"></div>
            <div class="chatbot-loading-dot"></div>
            <div class="chatbot-loading-dot"></div>
        `;
        
        loadingDiv.appendChild(avatar);
        loadingDiv.appendChild(loading);
        messagesContainer.appendChild(loadingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    // Retirer le chargement
    function removeLoading() {
        const loadingDiv = document.getElementById('chatbot-loading');
        if (loadingDiv) {
            loadingDiv.remove();
        }
    }
    
    // Envoyer un message
    async function sendMessage() {
        const message = input.value.trim();
        
        if (!message) return;
        
        // Désactiver l'input pendant l'envoi
        input.disabled = true;
        sendBtn.disabled = true;
        
        // Ajouter le message de l'utilisateur
        addMessage(message, 'user');
        input.value = '';
        
        // Afficher le chargement
        showLoading();
        
        try {
            // Construire le prompt avec historique
            let fullPrompt = SYSTEM_PROMPT;
            
            // Ajouter l'historique de conversation pour le contexte
            if (conversationHistory.length > 0) {
                fullPrompt += '\n\n# Historique récent:\n';
                conversationHistory.slice(-3).forEach(msg => {
                    fullPrompt += `\nRecruteur: ${msg.user}\nAssistant: ${msg.ai}\n`;
                });
            }
            
            fullPrompt += `\n\n${message}`;
            
            // Appeler Ollama directement
            const response = await fetch(OLLAMA_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: MODEL,
                    prompt: fullPrompt,
                    stream: false,
                    options: {
                        temperature: 0.3,
                        top_p: 0.9,
                        num_predict: 400
                    }
                })
            });
            
            if (!response.ok) {
                throw new Error(`Erreur HTTP: ${response.status}`);
            }
            
            const data = await response.json();
            
            // Retirer le chargement
            removeLoading();
            
            // Ajouter la réponse de l'IA
            if (data.response) {
                const aiResponse = data.response.trim();
                addMessage(aiResponse, 'ai');
                
                // Sauvegarder dans l'historique
                conversationHistory.push({
                    user: message,
                    ai: aiResponse
                });
                
                // Garder seulement les 5 derniers échanges
                if (conversationHistory.length > 5) {
                    conversationHistory = conversationHistory.slice(-5);
                }
            } else {
                addMessage("Désolé, je n'ai pas pu générer de réponse. Veuillez réessayer.", 'ai');
            }
            
        } catch (error) {
            console.error('Erreur:', error);
            removeLoading();
            addMessage(
                "⚠️ Erreur de connexion avec Ollama. Assurez-vous qu'Ollama est bien installé et lancé sur le serveur (ollama serve).",
                'ai'
            );
        } finally {
            // Réactiver l'input
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }
    
    // Démarrer quand le DOM est prêt
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
